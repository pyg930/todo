<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>To-do list</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#EDEFEA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141816" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="To-do">
<script src="vendor/firebase-app-compat.js"></script>
<script src="vendor/firebase-auth-compat.js"></script>
<script src="vendor/firebase-firestore-compat.js"></script>
<script src="https://accounts.google.com/gsi/client" async></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDEFEA; --surface:#FAFBF8; --ink:#1F2A24; --muted:#67716A; --line:#D7DBD3;
  --accent:#2F5D50; --accent-soft:#DCE8E1; --on-accent:#FFFFFF;
  --event:#56677A; --event-soft:#E2E7EC; --high:#C2412D; --trip:#A8701A; --trip-soft:#F2E5CC;
  --sun:#B8473A; --sat:#3F6390;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141816; --surface:#1D221F; --ink:#E5E9E4; --muted:#98A29B; --line:#313834;
    --accent:#7DB5A2; --accent-soft:#22352E; --on-accent:#0F1A16;
    --event:#9DADBB; --event-soft:#252E37; --high:#EA7660; --trip:#E2AA55; --trip-soft:#3A2F1C;
    --sun:#E08A7E; --sat:#8FAAD6; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141816; --surface:#1D221F; --ink:#E5E9E4; --muted:#98A29B; --line:#313834;
  --accent:#7DB5A2; --accent-soft:#22352E; --on-accent:#0F1A16;
  --event:#9DADBB; --event-soft:#252E37; --high:#EA7660; --trip:#E2AA55; --trip-soft:#3A2F1C;
  --sun:#E08A7E; --sat:#8FAAD6; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:1180px;margin:0 auto;padding:28px 20px 72px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
h2{font-size:15px;font-weight:600;margin:0}
.head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.head .grow{flex:1}
.muted{color:var(--muted)}
.small{font-size:13px}
.btn{border:1px solid var(--line);background:transparent;border-radius:8px;padding:4px 10px;min-height:32px;cursor:pointer;font-size:14px;white-space:nowrap;flex:none}
.btn:hover{background:var(--bg)}
.btn-primary{background:var(--accent);color:var(--on-accent);border:none;border-radius:9px;padding:0 16px;min-height:36px;font-weight:600;cursor:pointer;font-size:14px;white-space:nowrap;flex:none}
.btn-text{background:none;border:none;color:var(--muted);cursor:pointer;padding:6px 8px;border-radius:8px;font-size:14px}
.btn-text:hover{color:var(--ink)}
.danger{color:var(--high)!important}
.icon-btn{flex:none;width:34px;height:34px;display:inline-grid;place-items:center;border:1px solid var(--line);background:transparent;border-radius:9px;cursor:pointer;font-size:16px}
input[type=text],input[type=date],input[type=time],textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 9px;min-height:34px;font-size:14px}
input[type=text]{width:100%}
.top{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(290px,1fr);gap:18px;align-items:start}
.side{display:grid;gap:18px;grid-template-columns:minmax(0,1fr);min-width:0}
.top>*,.daygrid>*,.side>*{min-width:0}
.tt,.item button.it,.trow .tx,.evcard .t{overflow-wrap:anywhere}
html,body{overflow-x:hidden}
@supports (overflow:clip){html,body{overflow-x:clip}}

/* calendar */
.cal-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.cal-title{font-family:"Gowun Batang","Nanum Myeongjo","AppleMyungjo",serif;font-weight:700;font-size:34px;line-height:1;margin:0}
.cal-year{color:var(--muted);font-size:14px;align-self:flex-end;margin-bottom:3px}
.cal-head .grow{flex:1}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.wd{font-size:12px;color:var(--muted);text-align:left;padding:0 8px 6px}
.wd.sun{color:var(--sun)} .wd.sat{color:var(--sat)}
.cell{position:relative;min-height:118px;border:none;border-top:1px solid var(--line);background:transparent;text-align:left;padding:5px 4px 10px;cursor:pointer;display:flex;flex-direction:column;gap:3px;border-radius:0;min-width:0;overflow:hidden}
.lbls{display:flex;flex-direction:column;gap:2px;min-width:0}
.lb{display:block;font-size:11px;line-height:1.4;padding:1px 5px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--event-soft);color:var(--ink)}
.lb.tk{background:var(--accent-soft)}
.lb.due{background:transparent;color:var(--high);box-shadow:inset 0 0 0 1px var(--high);font-weight:600}
.lb.more{background:none;color:var(--muted);padding:0 5px}
.cell:hover{background:var(--bg)}
.cell .num{font-size:14px;width:26px;height:26px;display:grid;place-items:center;border-radius:50%;margin-left:-4px}
.cell.sun .num{color:var(--sun)} .cell.sat .num{color:var(--sat)}
.cell.out{opacity:.38}
.cell.today .num{background:var(--accent);color:var(--on-accent)}
.cell.sel{background:var(--accent-soft)}
.cell.sel::after{content:"";position:absolute;inset:0;border:2px solid var(--accent);border-radius:10px;pointer-events:none}
.dots{display:flex;flex-wrap:wrap;gap:3px;margin-top:auto}
.dot{width:7px;height:7px;border-radius:50%}
.dot.ev{background:var(--event)} .dot.tk{background:var(--accent)} .dot.due{background:var(--high)}
.tripbar{position:absolute;left:0;right:0;bottom:3px;height:4px;background:var(--trip)}
.tripbar.s{left:8px;border-radius:3px 0 0 3px}.tripbar.e{right:8px;border-radius:0 3px 3px 0}.tripbar.s.e{border-radius:3px}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;font-size:12px;color:var(--muted);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend .bar{width:14px;height:4px;border-radius:2px;background:var(--trip)}
.gstatus{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.gstatus.err{color:var(--high)}
.calpick{margin-top:8px;border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--bg)}
.calrow{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:14px;cursor:pointer;min-width:0}
.calrow input{width:18px;height:18px;margin:0;accent-color:var(--accent);flex:none}
.cdot{flex:none;width:10px;height:10px;border-radius:3px}
.acct{padding:4px 0 6px;border-bottom:1px solid var(--line)}
.acct:last-of-type{border-bottom:none}
.acct-head{display:flex;align-items:center;gap:4px;padding:4px 0 2px}
.acct-name{flex:1;min-width:0;font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cname{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* lists */
.rows{list-style:none;margin:0;padding:0}
.due-row{width:100%;display:flex;gap:10px;align-items:center;border:none;background:none;padding:7px 0;text-align:left;cursor:pointer;border-bottom:1px solid var(--line)}
.rows li:last-child .due-row{border-bottom:none}
.dd{flex:none;min-width:52px;font-size:12px;font-weight:600;color:var(--muted);padding:2px 6px;border-radius:6px;background:var(--bg);text-align:center}
.dd.soon{color:var(--today,var(--trip))}
.dd.today{background:var(--trip-soft);color:var(--trip)}
.dd.late{background:transparent;color:var(--high);border:1px solid var(--high)}
.src{flex:none;width:8px;height:8px;border-radius:2px}
.src.task{background:var(--accent)} .src.gcal{background:var(--event)}
.due-row .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.task{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.rows .task:last-child{border-bottom:none}
.check{flex:none;width:22px;height:22px;margin-top:1px;border-radius:6px;border:2px solid var(--muted);background:transparent;cursor:pointer;display:grid;place-items:center;padding:0;color:var(--on-accent)}
.check[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.check svg{width:13px;height:13px;opacity:0}
.check[aria-checked="true"] svg{opacity:1}
.tbody{flex:1;min-width:0;border:none;background:none;text-align:left;padding:0;cursor:pointer}
.tt{display:block;word-break:break-word}
.task.done .tt{text-decoration:line-through;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:12px;color:var(--muted);margin-top:1px}
.meta .late{color:var(--high);font-weight:500}
.meta .soon{color:var(--trip);font-weight:500}
.subhead{font-size:12px;color:var(--high);font-weight:600;margin:6px 0 0}
.evline{width:100%;border:none;background:var(--event-soft);color:var(--event);border-radius:8px;padding:6px 10px;text-align:left;font-size:13px;cursor:pointer;margin-bottom:6px}
.quick{display:flex;gap:6px;margin-top:10px}
.empty{color:var(--muted);font-size:14px;padding:6px 0}

.edit{border:1px solid var(--line);border-radius:12px;padding:12px;margin:6px 0;background:var(--bg)}
.edit .fields{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.field{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.edit input{background:var(--surface)}
.edit .acts{display:flex;gap:6px;align-items:center;margin-top:10px}
.acts .grow{flex:1}

/* trips */
.trip{width:100%;border:none;background:var(--trip-soft);border-radius:12px;padding:11px 13px;text-align:left;cursor:pointer;margin-bottom:8px;display:block}
.trip .r1{display:flex;align-items:baseline;gap:8px}
.trip .name{font-weight:600;flex:1;min-width:0}
.trip .tag{font-size:12px;font-weight:600;color:var(--trip)}
.trip .line{display:block;font-size:13px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* memo */
.memo{margin-top:18px}
.tabs{display:flex;gap:4px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.tab{border:none;background:none;padding:8px 12px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.dump{width:100%;min-height:240px;resize:vertical;line-height:1.7;font-size:15px;padding:12px 14px;background:var(--bg)}
.proj{border-bottom:1px solid var(--line)}
.proj:last-child{border-bottom:none}
.prow{display:flex;align-items:center;gap:6px}
.ptoggle{flex:1;display:flex;align-items:center;gap:8px;border:none;background:none;padding:10px 0;text-align:left;cursor:pointer;min-width:0}
.chev{display:inline-block;width:14px;transition:transform .15s;color:var(--muted)}
.ptoggle[aria-expanded="true"] .chev{transform:rotate(90deg)}
.pname{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcount{font-size:12px;color:var(--muted)}
.pbody{padding:0 0 12px 22px}
.items{list-style:none;margin:0;padding:0}
.item{display:block;border-left:2px solid var(--line);padding-left:4px}
.irow{display:flex;align-items:flex-start;gap:2px}
.irow.editing{gap:6px;padding:4px 0}
.ichev{flex:none;border:none;background:none;cursor:pointer;width:24px;height:32px;padding:0;color:var(--muted)}
.ichev[aria-expanded="true"] .chev{transform:rotate(90deg)}
.chev.ghost{opacity:.35}
.item button.it{flex:1;border:none;background:none;text-align:left;padding:6px 0;cursor:pointer;word-break:break-word;white-space:pre-wrap;line-height:1.5}
.isub{padding-left:20px;margin-bottom:6px}
.ita{flex:1;width:100%;resize:none;line-height:1.5;font-size:14px;overflow:hidden;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 9px;min-height:34px}
.quick .btn{align-self:flex-start;min-height:34px}
.item .x{opacity:.5}
.item:hover .x{opacity:1}

/* day view */
.dayhead{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.dayhead h1{font-family:"Gowun Batang","Nanum Myeongjo","AppleMyungjo",serif;font-weight:700;font-size:32px;margin:0;line-height:1.1}
.dayhead .grow{flex:1}
.daygrid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(300px,1fr);gap:18px;align-items:start}
.allday{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{border:none;border-radius:8px;padding:5px 10px;font-size:13px;cursor:pointer;background:var(--event-soft);color:var(--event);text-align:left}
.chip.trip{background:var(--trip-soft);color:var(--trip)}
.chip.sel,.blk.sel{outline:2px solid var(--ink);outline-offset:1px}
.tl{position:relative;margin-left:46px}
.hr{position:absolute;left:0;right:0;border-top:1px solid var(--line)}
.hr span{position:absolute;left:-46px;top:-9px;font-size:11px;color:var(--muted);width:40px;text-align:right}
.blk{position:absolute;border:none;border-radius:7px;padding:3px 7px;font-size:12px;line-height:1.3;text-align:left;overflow:hidden;cursor:pointer;background:var(--event-soft);color:var(--ink);border-left:3px solid var(--event)}
.blk.trip{background:var(--trip-soft);border-left-color:var(--trip)}
.blk.tk{background:var(--accent-soft);border-left-color:var(--accent)}
.blk.tk.done{opacity:.55;text-decoration:line-through}
.blk b{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.blk i{font-style:normal;color:var(--muted)}
.now{position:absolute;left:-6px;right:0;height:2px;background:var(--high);pointer-events:none}
.now::before{content:"";position:absolute;left:0;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--high)}
.evcard{margin-top:14px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--bg)}
.evcard .t{font-weight:600}
.evcard .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.evcard a{color:var(--muted);font-size:13px}
.addform{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
.addform .fields{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;align-items:center}

/* trip view */
.trow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:none}
.trow .ic{flex:none;width:22px;text-align:center}
.trow .tx{flex:1;min-width:0}
.trow .tx .d{font-size:12px;color:var(--muted)}
.namebar{display:flex;gap:8px;margin-bottom:6px}
.namebar input{font-size:20px;font-weight:600;min-height:44px}

.note{margin-top:24px;font-size:13px;color:var(--muted)}
/* banner */
.banner{display:flex;align-items:center;gap:20px;margin-bottom:18px;background:var(--accent-soft);border:none;padding:12px 24px;overflow:hidden}
.banner .cloud{flex:none;width:170px;height:128px}
.banner .cloud svg{width:100%;height:100%;overflow:visible}
.cloud-body{fill:#FFFFFF}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .cloud-body{fill:#E4EBEE} }
:root[data-theme="dark"] .cloud-body{fill:#E4EBEE}
.float{animation:float 3.2s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.twinkle{animation:twinkle 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
.zz{animation:zz 2.6s ease-in-out infinite}
.tail{transform-box:view-box;animation:wag 1.8s ease-in-out infinite}
@keyframes wag{0%,100%{transform:rotate(0)}50%{transform:rotate(-9deg)}}
.steam{animation:steam 2.2s ease-in-out infinite}
@keyframes steam{0%{opacity:0;transform:translateY(4px)}40%{opacity:.7}100%{opacity:0;transform:translateY(-6px)}}
.flip{transform-box:view-box;transform-origin:81px 86px;animation:flip 4.5s ease-in-out infinite}
@keyframes flip{0%,55%{transform:scaleX(1)}75%,100%{transform:scaleX(-1)}}
.bub{animation:bub 1.8s ease-in infinite}
@keyframes bub{0%{opacity:0;transform:translateY(6px)}30%{opacity:1}100%{opacity:0;transform:translateY(-16px)}}
.breathe{transform-box:fill-box;transform-origin:center bottom;animation:breathe 3.4s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.04)}}
.bounce{animation:bounce .9s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.plane{animation:plane 6s linear infinite}
@keyframes plane{0%{transform:translate(-30px,6px)}100%{transform:translate(170px,-4px)}}
@keyframes zz{0%{opacity:0;transform:translate(0,4px)}40%{opacity:1}100%{opacity:0;transform:translate(5px,-8px)}}
.banner .btxt{min-width:0}
.bubble{position:relative;display:inline-block;background:var(--surface);border-radius:12px;padding:3px 11px;font-size:13px;font-weight:600;color:var(--accent);margin:0 0 6px 6px}
.bubble::before{content:"";position:absolute;left:-6px;top:50%;margin-top:-5px;border:5px solid transparent;border-right-color:var(--surface);border-left:0}
.banner.deadline .bubble{color:var(--high)}
.banner.trip .bubble{color:var(--trip)}
.banner .bdate{font-size:13px;color:var(--muted)}
.banner .greet{font-family:"Gowun Batang","Nanum Myeongjo","AppleMyungjo",serif;font-weight:700;font-size:clamp(21px,3.6vw,30px);line-height:1.25;margin:2px 0 4px}
.banner .bsub{font-size:14px;color:var(--muted);margin:0}
@media (max-width:520px){ .banner{padding:10px 14px;gap:10px} .banner .cloud{width:110px;height:83px} .bubble{font-size:12px} }
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:14px;padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100% - 40px);z-index:20}
.toast.show{opacity:1}
/* login + account */
.login{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px 16px}
.login .card{max-width:380px;width:100%;text-align:center;padding:28px 24px}
.login .cloud{width:180px;height:135px;margin:0 auto 6px}
.login .cloud svg{width:100%;height:100%;overflow:visible}
.login h1{font-family:"Gowun Batang","Nanum Myeongjo","AppleMyungjo",serif;font-weight:700;font-size:30px;margin:4px 0 8px}
.login p{color:var(--muted);margin:0 0 20px;font-size:14px}
.gbtn{display:inline-flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:15px}
.gbtn:hover{background:var(--bg)}
.gbtn svg{width:18px;height:18px}
.account{margin-top:24px;display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;font-size:13px;color:var(--muted)}
.account .who{margin-right:auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* calendar side panel */
.calpanel{padding:14px}
.calpanel .head{margin-bottom:4px}
.calstate{display:flex;align-items:center;gap:6px;margin:0 0 8px;font-size:13px;color:var(--muted)}
.calstate.err{color:var(--high)}
.sdot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.sdot.ok{background:var(--accent)} .sdot.bad{background:var(--high)}
.calpanel .calpick{margin-top:0;border:none;padding:0;background:none}
.calpanel .acct{padding:6px 0 8px}
.acct-connect{width:100%;margin:4px 0 6px}

<body>
<div id="app"></div>
<div class="toast" id="toast" role="status"></div>
<script>
/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const WD = ['일','월','화','수','목','금','토'];
const CHECK_SVG = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7"/></svg>';
function h(tag, props, ...kids){
  const el = document.createElement(tag);
  if(props) for(const k in props){
    const v = props[k];
    if(v == null || v === false) continue;
    if(k === 'class') el.className = v;
    else if(k === 'style') el.style.cssText = v;
    else if(k === 'html') el.innerHTML = v;
    else if(k === 'value') el.value = v;
    else if(k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for(const c of kids.flat(3)){ if(c == null || c === false) continue; el.append(c.nodeType ? c : document.createTextNode(String(c))); }
  return el;
}
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseYmd(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function addDays(s, n){ const d = parseYmd(s); d.setDate(d.getDate()+n); return ymd(d); }
function diffDays(a, b){ return Math.round((parseYmd(b) - parseYmd(a)) / 86400000); }
const TODAY = () => ymd(new Date());
function mdLabel(s){ const d = parseYmd(s); return (d.getMonth()+1)+'/'+d.getDate(); }
function mdwLabel(s){ const d = parseYmd(s); return (d.getMonth()+1)+'월 '+d.getDate()+'일 ('+WD[d.getDay()]+')'; }
function hm(d){ return d.getHours()+':'+String(d.getMinutes()).padStart(2,'0'); }
function toMin(t){ const [a,b] = t.split(':').map(Number); return a*60+b; }
function fmtT(t){ const [a,b] = t.split(':'); return (+a)+':'+b; }
function newId(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function ddLabel(due){
  const n = diffDays(TODAY(), due);
  if(n < 0) return { text: (-n)+'일 지남', cls: 'late' };
  if(n === 0) return { text: 'D-day', cls: 'today' };
  return { text: 'D-'+n, cls: n <= 3 ? 'soon' : '' };
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2800); }

/* ================= state ================= */
const S = {
  mode: 'loading', tasks: {}, projects: {}, braindump: { text: '' },
  prefs: { excluded: [], included: [], names: {}, hidden: [], manual: [] },
  gcal: { events: new Map(), status: 'loading', code: null, busy: false, cals: null, acctErr: {} },
  view: { name: 'main' }, month: null, selected: TODAY(),
  memoTab: 'dump', editTask: null, selEvent: null, tripRef: null,
  addingTrip: false, showAllDue: false, openProj: new Set(), openItems: new Set(), editProj: null, editItem: null,
  armDel: null, drafts: {}, cameFromApp: false
};
{ const n = new Date(); S.month = new Date(n.getFullYear(), n.getMonth(), 1); }
const dv = (k, fb) => (k in S.drafts) ? S.drafts[k] : fb;
function clearDrafts(prefix){ for(const k of Object.keys(S.drafts)) if(k.startsWith(prefix)) delete S.drafts[k]; }
document.addEventListener('input', e => { const k = e.target && e.target.dataset && e.target.dataset.k; if(k) S.drafts[k] = e.target.value; });

/* ================= storage ================= */
/* Firebase: 데이터 창고 주소 (비밀번호가 아니라 공개돼도 되는 정보예요) */
const FB_CONFIG = {
  apiKey: "AIzaSyCH6_Jw7dC9I5K0jM3n_iA5XUG1os3C8oE",
  authDomain: "todo-66931.firebaseapp.com",
  projectId: "todo-66931",
  storageBucket: "todo-66931.firebasestorage.app",
  messagingSenderId: "339722263082",
  appId: "1:339722263082:web:35cd089a489b64cf384153"
};
/* 구글 캘린더 자동 재연결용 OAuth 클라이언트 ID (비워 두면 재연결할 때 로그인 창이 떠요) */
const GOOGLE_CLIENT_ID = '339722263082-p5ndj51464f7d5drkgpvh5qmcmitpc1i.apps.googleusercontent.com';
const CAL_SCOPE = 'https://www.googleapis.com/auth/calendar.readonly';
firebase.initializeApp(FB_CONFIG);
const auth = firebase.auth();
const fdb = firebase.firestore();
try{ fdb.enablePersistence({ synchronizeTabs: true }).catch(() => {}); }catch(_){}

let REFS = null, UNSUBS = [];
function normPrefs(o){ o = o || {}; return { excluded: [].concat(o.excluded||[]), included: [].concat(o.included||[]), names: Object.assign({}, o.names||{}), hidden: [].concat(o.hidden||[]), manual: [].concat(o.manual||[]), cals: Array.isArray(o.cals) ? o.cals.slice() : null, calsSeen: Array.isArray(o.calsSeen) ? o.calsSeen.slice() : null, accounts: [].concat(o.accounts||[]) }; }
function refsFor(uid){
  const base = fdb.collection('users').doc(uid);
  return { tasks: base.collection('tasks'), projects: base.collection('projects'),
    braindump: base.collection('meta').doc('braindump'), prefs: base.collection('meta').doc('tripprefs') };
}
function stopDb(){ UNSUBS.forEach(u => { try{ u(); }catch(_){} }); UNSUBS = []; REFS = null; }
function startDb(uid){
  stopDb();
  REFS = refsFor(uid);
  let got = false;
  const timer = setTimeout(() => { if(!got){ S.mode = 'error'; renderAll(); } }, 15000);
  const fail = () => { clearTimeout(timer); S.mode = 'error'; renderAll(); };
  UNSUBS.push(
    REFS.tasks.onSnapshot(s => { got = true; clearTimeout(timer); S.mode = 'db'; S.tasks = Object.fromEntries(s.docs.map(d => [d.id, d.data()])); renderAll(); }, fail),
    REFS.projects.onSnapshot(s => { S.projects = Object.fromEntries(s.docs.map(d => [d.id, d.data()])); renderAll(); }, () => {}),
    REFS.braindump.onSnapshot(d => { S.braindump = d.exists ? d.data() : { text: '' }; if(!('dump' in S.drafts)) renderAll(); }, () => {}),
    REFS.prefs.onSnapshot(d => { S.prefs = normPrefs(d.exists ? d.data() : null); renderAll(); }, () => {}));
}
const ready = () => S.mode === 'db';
function writeFail(e){
  const c = e && e.code;
  toast((c === 'quota_exceeded' || c === 'resource-exhausted') ?'저장 공간이 가득 찼어요. 오래된 항목을 지워 주세요.' : '저장하지 못했어요. 잠시 후 다시 해 보세요.');
}
const store = {
  put(coll, id, obj){
    if(!ready()){ toast('아직 불러오는 중이에요.'); return; }
    S[coll] = Object.assign({}, S[coll], { [id]: obj });
    REFS[coll].doc(id).set(obj).catch(writeFail);
    renderAll();
  },
  del(coll, id){
    if(!ready()) return;
    const c = Object.assign({}, S[coll]); delete c[id]; S[coll] = c;
    REFS[coll].doc(id).delete().catch(writeFail);
    renderAll();
  },
  doc(name, obj, noRender){
    if(!ready()){ toast('아직 불러오는 중이에요.'); return Promise.resolve(); }
    S[name] = obj;
    const p = REFS[name].set(obj).catch(writeFail);
    if(!noRender) renderAll();
    return p;
  }
};

/* ================= tasks ================= */
function normTask(id, t){ return { id, title: String(t.title||''), date: t.date || TODAY(), start: t.start||'', end: t.end||'', due: t.due||'', done: !!t.done, doneAt: +t.doneAt||0, created: +t.created||0 }; }
function allTasks(){ return Object.entries(S.tasks).map(([id,t]) => normTask(id,t)); }
function taskBody(t){ const { id, ...b } = t; return b; }
function sortDay(a, b){
  if(a.done !== b.done) return a.done ? 1 : -1;
  if(a.start && b.start) return toMin(a.start) - toMin(b.start);
  if(a.start !== b.start) return a.start ? -1 : 1;
  return a.created - b.created;
}
function tasksOn(d){ return allTasks().filter(t => t.date === d).sort(sortDay); }
function toggleTask(t){ store.put('tasks', t.id, taskBody(Object.assign({}, t, { done: !t.done, doneAt: !t.done ? Date.now() : 0 }))); }
function createTask(o){
  if(!o.title) return false;
  if(o.end && !o.start) o.end = '';
  if(o.start && o.end && toMin(o.end) <= toMin(o.start)){ toast('끝나는 시간이 시작 시간보다 늦어야 해요.'); return false; }
  store.put('tasks', newId(), { title: o.title, date: o.date, start: o.start||'', end: o.end||'', due: o.due||'', done: false, doneAt: 0, created: Date.now() });
  return true;
}

/* ================= google calendar ================= */
let gRanges = [], gQueue = Promise.resolve();
const RX_FLIGHT = /\bflights?\b|^air\s|\bairlines?\b|항공|비행/i;
const RX_HOTEL = /\b(hotel|inn|suites|marriott|hilton|hyatt|sheraton|westin|airbnb|resort|hostel|lodge)\b|\bstay at\b|숙소|호텔/i;
const RX_CONF = /\b(conference|symposium|congress|summit|workshop|annual meeting)\b|학회/i;
const RX_DUE = /마감|deadline|\bdue\b/i;
const isFlight = e => RX_FLIGHT.test(e.title);
const isHotel = e => !isFlight(e) && RX_HOTEL.test(e.title);
const isConf = e => RX_CONF.test(e.title);
const autoTravel = e => isFlight(e) || isHotel(e) || isConf(e);
const evIcon = e => isFlight(e) ? '✈' : isHotel(e) ? '🏨' : isConf(e) ? '🎓' : '📅';
function normEvent(e, cal){
  if(!e || !e.id || e.status === 'cancelled' || !e.start) return null;
  const allDay = !!e.start.date;
  const s = allDay ? parseYmd(e.start.date) : new Date(e.start.dateTime);
  const en = allDay ? parseYmd((e.end && e.end.date) || e.start.date) : new Date((e.end && e.end.dateTime) || e.start.dateTime);
  if(isNaN(s) || isNaN(en)) return null;
  /* 내 기본 캘린더 일정은 원래 id 그대로 (여행 이름 등 저장된 설정이 이어지도록), 공유받은 캘린더는 캘린더 id를 붙여 구분 */
  const id = (!cal || cal.main) ? e.id : e.id + '|' + cal.id;
  return { id, title: String(e.summary || '(제목 없음)').trim(), location: e.location || '', allDay,
    long: !allDay && (en - s) >= 20*3600000, start: s, end: en < s ? s : en, link: e.htmlLink || '', type: e.eventType || 'DEFAULT',
    calId: cal ? cal.id : '', calName: cal ? cal.name : '', uid: e.iCalUID || '' };
}
function evFirst(e){ return ymd(e.start); }
function evLast(e){ const l = ymd(new Date(Math.max(e.end.getTime()-1, e.start.getTime()))); return l < evFirst(e) ? evFirst(e) : l; }
function evOn(e, d){ return evFirst(e) <= d && d <= evLast(e); }
/* ---------- Google Calendar 직접 연결 (여러 구글 계정) ---------- */
/* 계정: 'primary' = 사이트에 로그인한 계정, 그 밖에는 추가한 계정의 이메일 */
const TOK_KEY = 'gcal.tokens.v2', EVC_KEY = 'gcal.cache.v1', CALS_KEY = 'gcal.cals.v2';
let TOKS = {};
function loadTok(){
  try{ const o = JSON.parse(localStorage.getItem(TOK_KEY)); if(o && typeof o === 'object') TOKS = o; }catch(_){}
  try{ const old = JSON.parse(localStorage.getItem('gcal.token.v1')); if(old && old.token && !TOKS.primary) TOKS.primary = old; localStorage.removeItem('gcal.token.v1'); }catch(_){}
}
function persistToks(){ try{ localStorage.setItem(TOK_KEY, JSON.stringify(TOKS)); }catch(_){} }
function saveTokFor(key, token, sec){ TOKS[key] = { token, exp: Date.now() + (Number(sec) || 3600) * 1000 }; persistToks(); }
function clearTokFor(key){ delete TOKS[key]; persistToks(); }
const tokOkFor = key => !!(TOKS[key] && TOKS[key].token && TOKS[key].exp > Date.now() + 60000);
const saveTok = (token, sec) => saveTokFor('primary', token, sec);
const tokOk = () => tokOkFor('primary');
function clearTok(){ TOKS = {}; persistToks(); }
const anyTok = () => accounts().some(a => tokOkFor(a.key));
function accounts(){
  const u = auth.currentUser;
  const list = [{ key: 'primary', email: (u && u.email) || '' }];
  for(const e of (S.prefs.accounts || [])) if(e && e !== list[0].email) list.push({ key: e, email: e });
  return list;
}
const acctLabel = a => a.key === 'primary' ? (a.email ? a.email + ' (로그인 계정)' : '로그인 계정') : a.email;
function saveEvCache(){
  try{ localStorage.setItem(EVC_KEY, JSON.stringify([...S.gcal.events.values()].map(e => Object.assign({}, e, { start: e.start.getTime(), end: e.end.getTime() })))); }catch(_){}
}
function loadEvCache(){
  try{ const c = JSON.parse(localStorage.getItem(CALS_KEY)); if(Array.isArray(c)) S.gcal.cals = c; }catch(_){}
  try{ const a = JSON.parse(localStorage.getItem(EVC_KEY)); if(Array.isArray(a)) for(const e of a){ if(e && e.id) S.gcal.events.set(e.id, Object.assign({}, e, { start: new Date(e.start), end: new Date(e.end) })); } }catch(_){}
}
function calProvider(){ const p = new firebase.auth.GoogleAuthProvider(); p.addScope(CAL_SCOPE); p.setCustomParameters({ prompt: 'select_account' }); return p; }
let tokenClient = null;
function gisReady(){ return !!(GOOGLE_CLIENT_ID && window.google && google.accounts && google.accounts.oauth2); }
function requestTokenGIS(hint, prompt){
  return new Promise((res, rej) => {
    if(!tokenClient) tokenClient = google.accounts.oauth2.initTokenClient({ client_id: GOOGLE_CLIENT_ID, scope: CAL_SCOPE, callback: () => {} });
    tokenClient.callback = r => (r && r.access_token) ? res(r) : rej(r);
    tokenClient.error_callback = e => rej(e);
    const o = { prompt: prompt || '' };
    if(hint){ o.hint = hint; o.login_hint = hint; }
    tokenClient.requestAccessToken(o);
  });
}
const CANCEL = ['auth/popup-closed-by-user', 'auth/cancelled-popup-request', 'popup_closed', 'popup_failed_to_open'];
function connectFail(e){
  const c = e && (e.code || e.type || e.error);
  if(c === 'popup_failed_to_open') toast('팝업이 막혔어요. 브라우저에서 팝업을 허용해 주세요.');
  else if(c === 'access_denied') toast('구글이 접근을 막았어요. 학교 계정이면 학교에서 이 앱을 막았을 수 있어요.');
  else if(!CANCEL.includes(c)) toast('구글 캘린더에 연결하지 못했어요. 다시 눌러 주세요.');
}
/* 버튼을 눌렀을 때만 불러요 (브라우저가 팝업을 막지 않도록) */
async function connectCalendar(key){
  key = key || 'primary';
  if(!auth.currentUser) return;
  const acct = accounts().find(a => a.key === key); if(!acct) return;
  S.gcal.busy = true; renderAll();
  try{
    if(gisReady()){
      const r = await requestTokenGIS(acct.email); saveTokFor(key, r.access_token, r.expires_in);
    } else if(key === 'primary'){
      const r = await auth.currentUser.reauthenticateWithPopup(calProvider());
      const c = r && r.credential;
      if(!c || !c.accessToken) throw new Error('no_token');
      saveTok(c.accessToken, 3600);
    } else { throw { code: 'no_gis' }; }
    delete S.gcal.acctErr[key];
    if(key === 'primary'){ S.gcal.status = 'loading'; S.gcal.code = null; }
    S.gcal.busy = false;
    refreshGcal();
  }catch(e){ S.gcal.busy = false; renderAll(); connectFail(e); }
}
/* 다른 구글 계정(예: 학교 계정) 추가 */
async function addAccount(){
  if(!auth.currentUser) return;
  if(!gisReady()){ toast('계정 추가 준비가 아직 안 됐어요. (Client ID 설정 필요)'); return; }
  S.gcal.busy = true; renderAll();
  try{
    const r = await requestTokenGIS('', 'select_account');
    const tmp = '__new';
    saveTokFor(tmp, r.access_token, r.expires_in);
    let email = '';
    try{
      const u = new URL('https://www.googleapis.com/calendar/v3/users/me/calendarList'); u.searchParams.set('minAccessRole', 'owner');
      const p = await gcalGet(u, tmp);
      const pc = (p.items || []).find(c => c.primary);
      email = pc ? pc.id : '';
    } finally { clearTokFor(tmp); }
    if(!email) throw { code: 'no_email' };
    const known = accounts();
    if(known.some(a => a.email === email)){ toast('이미 연결된 계정이에요.'); saveTokFor(known.find(a => a.email === email).key, r.access_token, r.expires_in); }
    else {
      saveTokFor(email, r.access_token, r.expires_in);
      savePrefs(p => { p.accounts = (p.accounts || []).filter(x => x !== email).concat([email]); });
      toast(email + ' 계정을 추가했어요.');
    }
    S.gcal.busy = false;
    S.gcal.calsAt = 0; refreshGcal();
  }catch(e){
    S.gcal.busy = false; renderAll();
    if(e && e.code === 'needs_token') toast('구글이 캘린더를 보여주지 않았어요. 권한 화면에서 캘린더에 체크했는지 확인해 주세요.');
    else connectFail(e);
  }
}
function removeAccount(email){
  if(!confirm(email + ' 계정 연결을 끊을까요? 그 계정의 일정이 달력에서 사라져요.')) return;
  const t = TOKS[email];
  if(t && t.token && window.google && google.accounts && google.accounts.oauth2) try{ google.accounts.oauth2.revoke(t.token, () => {}); }catch(_){}
  clearTokFor(email); delete S.gcal.acctErr[email];
  for(const [id, e] of S.gcal.events) if(e.acct === email) S.gcal.events.delete(id);
  if(S.gcal.cals) S.gcal.cals = S.gcal.cals.filter(c => c.acct !== email);
  savePrefs(p => { p.accounts = (p.accounts || []).filter(x => x !== email); if(Array.isArray(p.cals)) p.cals = p.cals.filter(id => (S.gcal.cals || []).some(c => c.id === id)); });
  saveEvCache();
}
function startCalendar(){
  if(!auth.currentUser) return;
  if(!tokOk()){ S.gcal.status = 'error'; S.gcal.code = 'needs_token'; }
  if(anyTok() && !gRanges.length){ const r = baseRange(); queueFetch(r[0], r[1]); }
  renderAll();
}
async function gcalPage(a, b, pageToken, calId, key){
  const u = new URL('https://www.googleapis.com/calendar/v3/calendars/' + encodeURIComponent(calId || 'primary') + '/events');
  u.searchParams.set('timeMin', parseYmd(a).toISOString());
  u.searchParams.set('timeMax', parseYmd(b).toISOString());
  u.searchParams.set('singleEvents', 'true');
  u.searchParams.set('orderBy', 'startTime');
  u.searchParams.set('maxResults', '250');
  if(pageToken) u.searchParams.set('pageToken', pageToken);
  return gcalGet(u, key);
}
/* 계정마다 볼 수 있는 캘린더 목록 (내 캘린더 + 공유받은 캘린더) */
async function loadCalsFor(acct){
  const u = new URL('https://www.googleapis.com/calendar/v3/users/me/calendarList');
  u.searchParams.set('minAccessRole', 'reader');
  u.searchParams.set('maxResults', '250');
  const p = await gcalGet(u, acct.key);
  const items = Array.isArray(p.items) ? p.items : [];
  return items.filter(c => c && c.id && !c.deleted).map(c => ({ id: c.id, name: String(c.summaryOverride || c.summary || c.id), primary: !!c.primary,
    main: !!c.primary && acct.key === 'primary', selected: !!c.selected, color: c.backgroundColor || '', acct: acct.key }))
    .sort((x, y) => (y.primary - x.primary) || x.name.localeCompare(y.name));
}
function mergeCals(byAcct){
  const out = [], seen = new Set();
  for(const a of accounts()){
    const list = byAcct[a.key] || (S.gcal.cals || []).filter(c => c.acct === a.key);
    for(const c of list) if(!seen.has(c.id)){ seen.add(c.id); out.push(c); }
  }
  S.gcal.cals = out;
  try{ localStorage.setItem(CALS_KEY, JSON.stringify(out)); }catch(_){}
}
const AUTO_SKIP = /#holiday@|#contacts@|#weather@|addressbook#/;
function activeCals(){
  const cals = S.gcal.cals || [];
  if(Array.isArray(S.prefs.cals)){
    /* 새로 추가한 계정의 캘린더는 고른 적이 없으니 기본 규칙으로 보여줘요 */
    const want = new Set(S.prefs.cals), decided = new Set(S.prefs.calsSeen || S.prefs.cals);
    return cals.filter(c => want.has(c.id) || (!decided.has(c.id) && (c.primary || (c.selected && !AUTO_SKIP.test(c.id)))));
  }
  return cals.filter(c => c.primary || (c.selected && !AUTO_SKIP.test(c.id)));
}
function setCalOn(cal, on){
  const now = activeCals().map(c => c.id).filter(id => id !== cal.id);
  if(on) now.push(cal.id);
  savePrefs(p => { p.cals = now; p.calsSeen = (S.gcal.cals || []).map(c => c.id); });
  if(on && tokOkFor(cal.acct)) refreshGcal();
}
async function gcalGet(u, key){
  key = key || 'primary';
  const t = TOKS[key];
  if(!t || !t.token) throw { code: 'needs_token' };
  let r;
  try{ r = await fetch(u, { headers: { Authorization: 'Bearer ' + t.token } }); }
  catch(_){ throw { code: 'server_unavailable', retryable: true }; }
  if(r.ok) return r.json();
  let reason = '';
  try{ const j = await r.json(); const er = j && j.error; reason = JSON.stringify(er || ''); }catch(_){}
  if(r.status === 401){ clearTokFor(key); throw { code: 'needs_token' }; }
  if(r.status === 403){
    if(/accessNotConfigured|SERVICE_DISABLED|has not been used/i.test(reason)) throw { code: 'api_disabled' };
    if(/insufficient|ACCESS_TOKEN_SCOPE/i.test(reason)){ clearTokFor(key); throw { code: 'consent_required' }; }
    if(/rateLimit|quota/i.test(reason)) throw { code: 'server_unavailable', retryable: true };
    throw { code: 'tool_error' };
  }
  if(r.status === 429 || r.status >= 500) throw { code: 'server_unavailable', retryable: true };
  throw { code: 'tool_error' };
}
function gridRange(m){ const first = new Date(m.getFullYear(), m.getMonth(), 1); const s = ymd(first); const start = addDays(s, -first.getDay()); return [start, addDays(start, 42)]; }
function baseRange(){ const g = gridRange(S.month); const a = addDays(TODAY(), -21), b = addDays(TODAY(), 75); return [g[0] < a ? g[0] : a, g[1] > b ? g[1] : b]; }
const STOP = ['needs_token','consent_required','api_disabled'];
async function fetchAcct(acct, a, b, refresh, got){
  let cals = (S.gcal.cals || []).filter(c => c.acct === acct.key);
  const fresh = {};
  if(!cals.length || refresh){ cals = await loadCalsFor(acct); fresh[acct.key] = cals; }
  const act = new Set(activeCals().map(c => c.id));
  if(fresh[acct.key]){ mergeCals(fresh); act.clear(); activeCals().forEach(c => act.add(c.id)); }
  for(const cal of (S.gcal.cals || []).filter(c => c.acct === acct.key && act.has(c.id))){
    let token = null, n = 0;
    try{
      do{
        const p = await gcalPage(a, b, token, cal.id, acct.key);
        if(Array.isArray(p.items)) for(const raw of p.items){ const e = normEvent(raw, cal); if(e){ e.acct = acct.key; got.push(e); } }
        token = p.nextPageToken; n++;
      } while(token && n < 6);
    }catch(err){
      /* 공유가 끊긴 캘린더 하나 때문에 전체가 멈추지 않도록 건너뛰어요 */
      if(err && err.code === 'tool_error' && !cal.primary) continue;
      throw err;
    }
  }
}
async function fetchRange(a, b, refresh, retried){
  const accts = accounts().filter(x => tokOkFor(x.key));
  if(!tokOk()){ S.gcal.status = 'error'; S.gcal.code = 'needs_token'; }
  if(!accts.length){ renderAll(); return; }
  S.gcal.busy = true; if(S.gcal.status !== 'ok' && tokOk()) S.gcal.status = 'loading'; renderAll();
  const got = [], done = new Set();
  let primaryErr = null;
  for(const acct of accts){
    try{ await fetchAcct(acct, a, b, refresh, got); done.add(acct.key); delete S.gcal.acctErr[acct.key]; }
    catch(err){
      const code = (err && err.code) || 'upstream_error';
      if(err && err.retryable && !retried){ await sleep(800 + Math.random()*700); S.gcal.busy = false; return fetchRange(a, b, refresh, true); }
      if(acct.key === 'primary') primaryErr = code; else S.gcal.acctErr[acct.key] = code;
    }
  }
  if(done.size){
    for(const [id, e] of S.gcal.events) if(evFirst(e) >= a && evFirst(e) < b && done.has(e.acct || 'primary')) S.gcal.events.delete(id);
    /* 여러 계정·캘린더에 같은 초대가 들어 있으면 한 번만 보여줘요 (로그인 계정 쪽을 남김) */
    const seen = new Set();
    for(const e of S.gcal.events.values()) if(e.uid) seen.add(e.uid + '@' + e.start.getTime());
    for(const e of got){
      const k = e.uid ? e.uid + '@' + e.start.getTime() : '';
      if(k && seen.has(k)) continue;
      if(k) seen.add(k);
      S.gcal.events.set(e.id, e);
    }
    if(!gRanges.some(r => r[0] === a && r[1] === b)) gRanges.push([a, b]);
    saveEvCache();
  }
  if(primaryErr){ S.gcal.status = 'error'; S.gcal.code = primaryErr; }
  else if(done.has('primary')){ S.gcal.status = 'ok'; S.gcal.code = null; }
  S.gcal.busy = false; renderAll();
}
function queueFetch(a, b, refresh){ gQueue = gQueue.then(() => fetchRange(a, b, refresh)); return gQueue; }
function ensureMonth(){
  if(!auth.currentUser || !anyTok() || (S.gcal.status === 'error' && S.gcal.code === 'api_disabled')) return;
  const r = gridRange(S.month);
  if(!gRanges.some(x => x[0] <= r[0] && x[1] >= r[1])) queueFetch(r[0], r[1]);
}
function refreshGcal(){
  if(!auth.currentUser) return;
  const rs = gRanges.length ? gRanges.slice() : [baseRange()];
  rs.forEach(r => queueFetch(r[0], r[1], true));
}
function gcalMsg(){
  const g = S.gcal;
  if(g.status === 'loading') return '구글 캘린더 불러오는 중…';
  if(g.status === 'ok') return '구글 캘린더 연결됨';
  const cached = S.gcal.events.size ? ' (지금은 마지막으로 불러온 일정을 보여주고 있어요)' : '';
  switch(g.code){
    case 'needs_token': return '구글 캘린더를 새로 불러오려면 연결 버튼을 눌러 주세요.' + cached;
    case 'consent_required': return '구글 캘린더를 볼 수 있게 허용해 주세요. 로그인 창에서 캘린더 항목에 체크해야 해요.';
    case 'api_disabled': return 'Google Cloud에서 Google Calendar API를 켜야 해요.';
    case 'server_unavailable': return '구글 캘린더가 잠시 응답하지 않아요.';
    case 'tool_error': return '구글 캘린더가 일정을 보내지 못했어요.';
    default: return '구글 캘린더를 불러오지 못했어요.';
  }
}

/* ---------- dedupe + trips ---------- */
function flightNo(t){ const m = t.match(/\b([A-Z]{2}|[A-Z]\d|\d[A-Z])\s?(\d{2,4})\b/); return m ? m[1]+m[2] : null; }
const rank = e => e.type === 'FROM_GMAIL' ? 1 : 0;
const hotelNorm = t => t.toLowerCase().replace(/stay at|reservation at|check-?in|체크인/g, '').replace(/\s+/g, ' ').trim();
function visibleEvents(){
  const act = S.gcal.cals ? new Set(activeCals().map(c => c.id)) : null;
  const evs = [...S.gcal.events.values()].filter(e => !act || !e.calId || act.has(e.calId)).sort((a,b) => a.start - b.start);
  const hide = new Set(), byKey = {};
  for(const e of evs) if(isFlight(e)){ const n = flightNo(e.title); if(n){ const k = n+'|'+evFirst(e); (byKey[k] = byKey[k] || []).push(e); } }
  for(const k in byKey){ const g = byKey[k]; if(g.length > 1){ g.sort((a,b) => rank(a)-rank(b)); g.slice(1).forEach(e => hide.add(e.id)); } }
  const hotels = evs.filter(isHotel);
  for(let i = 0; i < hotels.length; i++) for(let j = i+1; j < hotels.length; j++){
    const a = hotels[i], b = hotels[j];
    if(hide.has(a.id) || hide.has(b.id) || evFirst(a) !== evFirst(b)) continue;
    const na = hotelNorm(a.title), nb = hotelNorm(b.title);
    if(na && nb && (na.includes(nb) || nb.includes(na))) hide.add(rank(a) <= rank(b) ? b.id : a.id);
  }
  return evs.filter(e => !hide.has(e.id));
}
function cleanCity(s){ return s.split(',')[0].trim().replace(/\s+[A-Z]{2}$/, '').replace(/\b(St Pl|Metro|Intl|International|Airport)\b/gi, '').replace(/\s+/g, ' ').trim(); }
function flightDest(t){ const m = t.match(/\bto\s+(.+?)(?:\s*\(|,|$)/i); return m ? cleanCity(m[1]) : ''; }
function flightRoute(t){
  const m = t.match(/\bfrom\s+(.+?)\s+to\s+(.+?)(?:\s*\(|,|$)/i);
  if(m) return cleanCity(m[1]) + ' → ' + cleanCity(m[2]);
  const d = flightDest(t); return d ? '→ ' + d : t;
}
const hotelName = t => t.replace(/^(stay at|reservation at)\s+/i, '').trim();
function isTravel(e, P){ return (autoTravel(e) && !P.ex.has(e.id)) || P.inc.has(e.id); }
function prefSets(){ return { ex: new Set(S.prefs.excluded), inc: new Set(S.prefs.included), hid: new Set(S.prefs.hidden) }; }
function homeCity(flights){
  const cnt = {};
  for(const f of flights){ const m = f.title.match(/\bfrom\s+(.+?)\s+to\s+/i); if(m){ const c = cleanCity(m[1]); if(c) cnt[c] = (cnt[c]||0) + 1; } }
  let best = '', n = 0; for(const c in cnt) if(cnt[c] > n){ best = c; n = cnt[c]; }
  return best;
}
function autoName(evs, home){
  const notHome = d => d && (!home || d.toLowerCase() !== home.toLowerCase());
  const fl = evs.filter(isFlight).filter(e => notHome(flightDest(e.title)));
  if(fl.length){
    const day0 = evFirst(fl[0]);
    const firstDay = fl.filter(e => evFirst(e) === day0);
    return flightDest(firstDay[firstDay.length-1].title);
  }
  const c = evs.find(isConf); if(c) return c.title;
  const ho = evs.find(isHotel); if(ho) return hotelName(ho.title);
  return '여행';
}
function computeTrips(evs){
  const P = prefSets();
  const tev = evs.filter(e => isTravel(e, P));
  const trips = S.prefs.manual.map(m => ({ key: 'm:'+m.id, manual: m, name: m.name || '여행', startDay: m.start, endDay: m.end, events: [], hidden: false }));
  const rest = [];
  for(const e of tev){
    const t = trips.find(t => evFirst(e) <= t.endDay && evLast(e) >= t.startDay);
    if(t) t.events.push(e); else rest.push(e);
  }
  const home = homeCity(rest.filter(isFlight));
  const cl = []; let open = null;
  for(const e of rest){
    const f = evFirst(e), l = evLast(e);
    if(open && f > addDays(open.endDay, open.flying ? 7 : 2)) open = null;
    if(!open){ open = { events: [], startDay: f, endDay: l, flying: false }; cl.push(open); }
    open.events.push(e); if(l > open.endDay) open.endDay = l;
    if(isFlight(e)){
      const dest = flightDest(e.title);
      if(home && dest && dest.toLowerCase() === home.toLowerCase()) open = null;
      else open.flying = true;
    }
  }
  for(const c of cl){
    const named = c.events.find(e => S.prefs.names[e.id]);
    trips.push({ key: 'a:'+c.events[0].id, manual: null, name: named ? S.prefs.names[named.id] : autoName(c.events, home),
      startDay: c.startDay, endDay: c.endDay, events: c.events, hidden: c.events.some(e => P.hid.has(e.id)) });
  }
  return trips.sort((a,b) => a.startDay < b.startDay ? -1 : 1);
}
function tripTag(t){
  const today = TODAY();
  if(t.startDay <= today && today <= t.endDay) return '진행 중';
  const n = diffDays(today, t.startDay); return n > 0 ? 'D-'+n : '지남';
}
function savePrefs(mut){ const p = normPrefs(S.prefs); mut(p); store.doc('prefs', p); }
function setTravel(e, on){
  savePrefs(p => {
    p.excluded = p.excluded.filter(x => x !== e.id); p.included = p.included.filter(x => x !== e.id);
    if(on && !autoTravel(e)) p.included.push(e.id);
    if(!on && autoTravel(e)) p.excluded.push(e.id);
  });
}

/* ================= navigation ================= */
function selectDate(d){
  if(S.selected === d){ openDay(d); return; }
  S.selected = d; S.editTask = null; renderAll();
}
function openDay(d){ S.cameFromApp = true; S.selEvent = null; S.editTask = null; location.hash = 'day-' + d; }
function openTrip(t){ S.cameFromApp = true; S.tripRef = { key: t.key, members: t.events.map(e => e.id) }; clearDrafts('trip-'); location.hash = 'trip'; }
function goMain(){ if(S.cameFromApp && history.length > 1){ S.cameFromApp = false; history.back(); } else location.hash = ''; }
function route(){
  const hs = location.hash.slice(1);
  const m = hs.match(/^day-(\d{4}-\d{2}-\d{2})$/);
  if(m){
    S.view = { name: 'day', date: m[1] }; S.selected = m[1];
    const d = parseYmd(m[1]); S.month = new Date(d.getFullYear(), d.getMonth(), 1); ensureMonth();
  } else if(hs === 'trip' && S.tripRef) S.view = { name: 'trip' };
  else S.view = { name: 'main' };
  S.editTask = null;
  window.scrollTo(0, 0); renderAll();
}
window.addEventListener('hashchange', route);
document.addEventListener('keydown', e => { if(e.key === 'Escape' && S.showCals && window.innerWidth < 1080){ S.showCals = false; renderAll(); } });

/* ================= render root ================= */
let CTX = null;
function renderAll(){
  const ae = document.activeElement; let keep = null;
  if(ae && ae.dataset && ae.dataset.k){ keep = { k: ae.dataset.k, s: ae.selectionStart, e: ae.selectionEnd, st: ae.scrollTop }; }
  const evs = visibleEvents();
  CTX = { evs, trips: computeTrips(evs), P: prefSets() };
  const view = S.mode === 'signedout' ? renderLogin() : S.mode === 'auth' ? h('main', { class: 'login' }, h('p', { class: 'muted' }, '불러오는 중…'))
    : S.view.name === 'day' ? renderDay(S.view.date) : S.view.name === 'trip' ? renderTrip() : renderMain();
  $('#app').replaceChildren(view);
  if(keep){
    const el = document.querySelector('[data-k="' + CSS.escape(keep.k) + '"]');
    if(el){ el.focus({ preventScroll: true }); try{ if(keep.s != null) el.setSelectionRange(keep.s, keep.e); }catch(_){} el.scrollTop = keep.st; }
  }
}
function storageNote(){

const plainObj = o => o && typeof o === 'object' && !Array.isArray(o);
async function importData(file){
  if(!ready() || !file) return;
  let d;
  try{ d = JSON.parse(await file.text()); }catch(_){ toast('백업 파일을 읽지 못했어요.'); return; }
  if(!plainObj(d) || (!plainObj(d.tasks) && !plainObj(d.projects))){ toast('이 파일은 to-do 백업 파일이 아니에요.'); return; }
  const tasks = plainObj(d.tasks) ? Object.entries(d.tasks).filter(([, v]) => plainObj(v)) : [];
  const projects = plainObj(d.projects) ? Object.entries(d.projects).filter(([, v]) => plainObj(v)) : [];
  if(!confirm('할 일 ' + tasks.length + '개, 프로젝트 ' + projects.length + '개를 가져올게요. 같은 항목이 이미 있으면 백업 내용으로 바뀌어요. 계속할까요?')) return;
  const ops = [];
  tasks.forEach(([id, v]) => ops.push([REFS.tasks.doc(id), v]));
  projects.forEach(([id, v]) => ops.push([REFS.projects.doc(id), v]));
  if(plainObj(d.braindump) && (Array.isArray(d.braindump.items) || d.braindump.text)) ops.push([REFS.braindump, d.braindump]);
  if(plainObj(d.prefs)) ops.push([REFS.prefs, normPrefs(d.prefs)]);
  try{
    for(let i = 0; i < ops.length; i += 400){
      const b = fdb.batch(); ops.slice(i, i + 400).forEach(([ref, v]) => b.set(ref, v)); await b.commit();
    }
    toast('가져오기를 마쳤어요.');
  }catch(e){ writeFail(e); }
}

function bannerState(){
  const today = TODAY(), tomorrow = addDays(today, 1), hr = new Date().getHours();
  const tasks = allTasks();
  const todays = tasks.filter(t => t.date === today), overdue = tasks.filter(t => !t.done && t.date < today);
  const left = todays.filter(t => !t.done).length;
  const due = deadlineItems().filter(i => i.due <= tomorrow);
  if(due.length){
    const d = due[0], n = diffDays(today, d.due);
    return { mood: 'deadline', bubble: n < 0 ? '늦었다냥!' : n === 0 ? '오늘 마감이다냥!' : 'D-1이다냥!',
      greet: n < 0 ? '마감이 지났어요' : '마감이 코앞이에요', sub: d.title + (due.length > 1 ? ' 외 ' + (due.length - 1) + '개' : '') };
  }
  if(todays.length && left === 0 && !overdue.length) return { mood: 'celebrate', bubble: '다 했다냥!', greet: '오늘 할 일을 다 끝냈어요', sub: '정말 잘했어요. 푸욱 쉬어도 돼요.' };
  const trips = (CTX && CTX.trips || []).filter(t => !t.hidden);
  const now = trips.find(t => t.startDay <= today && today <= t.endDay);
  if(now) return { mood: 'trip', bubble: '여행 중이다냥', greet: now.name + '에서 좋은 시간 보내요', sub: left ? '오늘 남은 할 일 ' + left + '개' : '오늘은 남은 할 일이 없어요.' };
  const soon = trips.find(t => t.startDay > today && diffDays(today, t.startDay) <= 3);
  if(soon) return { mood: 'trip', bubble: '곧 출발이다냥!', greet: soon.name + ' 여행까지 D-' + diffDays(today, soon.startDay), sub: '짐 챙기는 거 잊지 마세요.' };
  const sub = left ? '오늘 남은 할 일 ' + left + '개' : '오늘은 여유로운 날이에요.';
  if(left >= 5 && hr >= 5 && hr < 21) return { mood: 'busy', bubble: '실험 중! 건드리지 마', greet: '할 일이 잔뜩 쌓였어요', sub };
  if(hr >= 5 && hr < 11) return { mood: 'morning', bubble: '냐암… 좋은 아침', greet: '좋은 아침이에요', sub };
  if(hr >= 11 && hr < 17) return { mood: 'afternoon', bubble: '공부 중…', greet: '오후도 힘내요', sub };
  if(hr >= 17 && hr < 21) return { mood: 'evening', bubble: '오늘도 수고했다냥', greet: '오늘 하루 수고했어요', sub };
  return { mood: 'night', bubble: 'Zzz', greet: '이제 푸욱 쉬어요', sub };
}

    const saveIt = () => { const v = (dv(kE, it.text) || '').trim(); delete S.drafts[kE]; S.editItem = null;
      save(v ? treeMap(p.items, it.id, x => Object.assign({}, x, { text: v })) : treeDel(p.items, it.id)); };
    row = h('div', { class: 'irow editing' },
      h('textarea', { class: 'ita', rows: lines(dv(kE, it.text)), 'data-k': kE, value: dv(kE, it.text), 'aria-label': '항목 고치기', oninput: autoGrow, onkeydown: multiKey(saveIt, cancel) }),
      h('button', { class: 'btn-primary', type: 'button', onclick: saveIt }, '저장'));
  } else {
    row = h('div', { class: 'irow' },
      h('button', { class: 'ichev', type: 'button', 'aria-expanded': String(open), 'aria-label': open ? '하위 항목 접기' : '하위 항목 펼치기',
        onclick: () => { open ? S.openItems.delete(it.id) : S.openItems.add(it.id); renderAll(); } }, h('span', { class: 'chev' + (kids.length ? '' : ' ghost'), 'aria-hidden': 'true' }, '▸')),
      h('button', { class: 'it', type: 'button', onclick: () => { S.editItem = kE; renderAll(); setTimeout(() => { const el = document.querySelector('[data-k="' + kE + '"]'); if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }, 0); } },
        it.text, kids.length && !open ? h('span', { class: 'pcount' }, '  ' + countTree(kids)) : null),
      h('button', { class: 'btn-text x', type: 'button', 'aria-label': '삭제', onclick: () => save(treeDel(p.items, it.id)) }, '×'));
  }
  let sub = null;
  if(open){
    const addSub = () => { const v = (S.drafts[kA] || '').trim(); if(!v) return; delete S.drafts[kA];
      save(treeMap(p.items, it.id, x => Object.assign({}, x, { children: (x.children || []).concat([{ id: newId(), text: v, children: [] }]) }))); };
    sub = h('div', { class: 'isub' },
      kids.length ? itemTree(p, kids, depth + 1) : null,
      depth + 1 < MAX_DEPTH ? h('div', { class: 'quick', style: 'margin-top:4px' },
        h('textarea', { class: 'ita', rows: lines(dv(kA, '')), 'data-k': kA, value: dv(kA, ''), placeholder: '+ 하위 항목', 'aria-label': '하위 항목 추가', oninput: autoGrow, onkeydown: multiKey(addSub) }),
        h('button', { class: 'btn', type: 'button', onclick: addSub }, '추가')) : null);
  }
  return h('li', { class: 'item' }, row, sub);
}
function projEl(p){
  const open = S.openProj.has(p.id);
  const kN = 'pn-' + p.id, kI = 'pi-' + p.id;
  const saveName = () => { const v = (dv(kN, p.name) || '').trim(); delete S.drafts[kN]; S.editProj = null; putProj(Object.assign({}, p, { name: v })); };
  let row;
  if(S.editProj === p.id){
    row = h('div', { class: 'prow', style: 'padding:8px 0' },
      h('input', { type: 'text', 'data-k': kN, value: dv(kN, p.name), placeholder: '프로젝트 이름', 'aria-label': '프로젝트 이름', autofocus: true,
        onkeydown: e => { if(e.key === 'Enter' && !e.isComposing){ e.preventDefault(); saveName(); } if(e.key === 'Escape'){ delete S.drafts[kN]; S.editProj = null; renderAll(); } } }),
      h('button', { class: 'btn-primary', type: 'button', onclick: saveName }, '저장'));
  } else {
    row = h('div', { class: 'prow' }, h('button', { class: 'ptoggle', type: 'button', 'aria-expanded': String(open), onclick: () => { open ? S.openProj.delete(p.id) : S.openProj.add(p.id); renderAll(); } },
      h('span', { class: 'chev', 'aria-hidden': 'true' }, '▸'), h('span', { class: 'pname' }, p.name || '이름 없는 프로젝트'), h('span', { class: 'pcount' }, p.items.length ? countTree(p.items) + '' : '')));
  }
  let body = null;
  if(open){
    const addItem = () => { const v = (S.drafts[kI] || '').trim(); if(!v) return; delete S.drafts[kI]; putProj(Object.assign({}, p, { items: p.items.concat([{ id: newId(), text: v, children: [] }]) })); };
    const armed = S.armDel === p.id;
    body = h('div', { class: 'pbody' },
      p.items.length ? itemTree(p, p.items, 0) : null,
      h('div', { class: 'quick', style: 'margin-top:8px' },
        h('textarea', { class: 'ita', rows: lines(dv(kI, '')), 'data-k': kI, value: dv(kI, ''), placeholder: '+ 세부 항목', 'aria-label': '세부 항목 추가', oninput: autoGrow, onkeydown: multiKey(addItem) }),
        h('button', { class: 'btn', type: 'button', onclick: addItem }, '추가')),
      h('div', { class: 'acts', style: 'display:flex;gap:4px;margin-top:6px' },
        h('button', { class: 'btn-text small', type: 'button', onclick: () => { S.editProj = p.id; renderAll(); } }, '이름 바꾸기'),
        h('button', { class: 'btn-text small danger', type: 'button', onclick: () => {
          if(!armed){ S.armDel = p.id; renderAll(); setTimeout(() => { if(S.armDel === p.id){ S.armDel = null; renderAll(); } }, 3000); return; }
          S.armDel = null; S.openProj.delete(p.id); store.del('projects', p.id); toast('프로젝트를 삭제했어요.');
        } }, armed ? '한 번 더 누르면 삭제돼요' : '프로젝트 삭제')));
  }
  return h('li', { class: 'proj' }, row, body);
}

/* ================= day view ================= */
const PX = 48;
function layoutCols(items){
  items.sort((a, b) => a.s - b.s || b.e - a.e);
  let cur = null, curEnd = -1; const clusters = [];
  for(const it of items){ if(!cur || it.s >= curEnd){ cur = []; clusters.push(cur); curEnd = it.e; } else curEnd = Math.max(curEnd, it.e); cur.push(it); }
  for(const c of clusters){ const cols = []; for(const it of c){ let i = cols.findIndex(e => e <= it.s); if(i < 0){ i = cols.length; cols.push(it.e); } else cols[i] = it.e; it.col = i; } c.forEach(it => it.n = cols.length); }
}
function renderDay(d){
  const today = TODAY(), dayStart = parseYmd(d), dayEnd = parseYmd(addDays(d, 1));
  const evs = eventsOn(d), P = CTX.P;
  const strip = evs.filter(e => e.allDay || e.long), timed = evs.filter(e => !e.allDay && !e.long);
  const tasks = tasksOn(d);
  const items = [];
  for(const e of timed){
    const s = Math.max(e.start, dayStart), en = Math.min(e.end, dayEnd);
    const sm = Math.round((s - dayStart) / 60000), em = Math.max(sm + 15, Math.round((en - dayStart) / 60000));
    items.push({ kind: 'ev', s: sm, eEnd: em, label: isFlight(e) ? '✈ ' + flightRoute(e.title) : e.title, time: hm(e.start) + '–' + hm(e.end), trip: isTravel(e, P), id: e.id });
  }
  for(const t of tasks) if(t.start){
    const sm = toMin(t.start), em = t.end ? toMin(t.end) : sm + 30;
    items.push({ kind: 'tk', t, s: sm, eEnd: em, label: t.title, time: fmtT(t.start) + (t.end ? '–' + fmtT(t.end) : ''), id: t.id });
  }
  items.forEach(it => it.e = it.eEnd);
  let timeline;
  if(items.length){
    layoutCols(items);
    const minH = Math.min(8, Math.floor(Math.min(...items.map(i => i.s)) / 60));
    const maxH = Math.min(24, Math.max(19, Math.ceil(Math.max(...items.map(i => i.e)) / 60)));
    const hours = []; for(let hr = minH; hr <= maxH; hr++) hours.push(h('div', { class: 'hr', style: 'top:' + ((hr - minH) * PX) + 'px' }, h('span', null, hr + ':00')));
    const blocks = items.map(it => {
      const top = (it.s - minH * 60) / 60 * PX, height = Math.max(24, (it.e - it.s) / 60 * PX - 2);
      const cls = 'blk' + (it.kind === 'tk' ? ' tk' + (it.t.done ? ' done' : '') : (it.trip ? ' trip' : '')) + (S.selEvent === it.id ? ' sel' : '');
      return h('button', { class: cls, type: 'button', style: `top:${top}px;height:${height}px;left:calc(${it.col / it.n * 100}% + 2px);width:calc(${100 / it.n}% - 4px)`,
        'aria-label': it.time + ' ' + it.label,
        onclick: () => { if(it.kind === 'tk'){ clearDrafts('e-'); S.editTask = it.id; S.selEvent = null; } else { S.selEvent = S.selEvent === it.id ? null : it.id; } renderAll(); } },
        h('b', null, it.label), height > 34 ? h('i', null, it.time) : null);
    });
    let now = null;
    if(d === today){ const n = new Date(), nm = n.getHours() * 60 + n.getMinutes(); if(nm >= minH * 60 && nm <= maxH * 60) now = h('div', { class: 'now', style: 'top:' + ((nm - minH * 60) / 60 * PX) + 'px' }); }
    timeline = h('div', { class: 'tl', style: 'height:' + ((maxH - minH) * PX + 8) + 'px' }, hours, blocks, now);
  } else timeline = h('p', { class: 'empty' }, '이날은 시간이 정해진 일정이 없어요.');

  let evcard = null;
  const sel = S.selEvent && evs.find(e => e.id === S.selEvent);
  if(sel){
    const tr = isTravel(sel, P);
    const when = sel.allDay ? (evFirst(sel) === evLast(sel) ? '하루 종일' : mdLabel(evFirst(sel)) + ' – ' + mdLabel(evLast(sel))) :
      (sel.long ? mdLabel(evFirst(sel)) + ' ' + hm(sel.start) + ' – ' + mdLabel(evLast(sel)) + ' ' + hm(sel.end) : hm(sel.start) + ' – ' + hm(sel.end));
    evcard = h('div', { class: 'evcard' },
      h('div', { class: 't' }, sel.title), h('div', { class: 'muted small' }, when), sel.location ? h('div', { class: 'muted small' }, sel.location) : null,
      (sel.calName && activeCals().length > 1) ? h('div', { class: 'muted small' }, '캘린더: ' + sel.calName) : null,
      h('div', { class: 'acts' },
        h('button', { class: 'btn', type: 'button', onclick: () => setTravel(sel, !tr) }, tr ? '여행에서 빼기' : '여행에 넣기'),
        sel.link ? h('a', { href: sel.link, target: '_blank', rel: 'noopener' }, '구글 캘린더에서 보기') : null,
        h('span', { class: 'grow' }),
        h('button', { class: 'btn-text', type: 'button', onclick: () => { S.selEvent = null; renderAll(); } }, '닫기')));
  }

  const k = s => 'da-' + s;
  const add = () => {
    const title = (S.drafts[k('title')] || '').trim(); if(!title){ toast('할 일을 적어 주세요.'); return; }
    if(createTask({ title, date: d, start: S.drafts[k('start')] || '', end: S.drafts[k('end')] || '', due: S.drafts[k('due')] || '' })){ clearDrafts('da-'); renderAll(); }
  };
  const go = n => { S.selEvent = null; S.editTask = null; location.replace('#day-' + addDays(d, n)); };

  return h('main', { class: 'app' },
    h('div', { class: 'dayhead' },
      h('button', { class: 'icon-btn', type: 'button', 'aria-label': '메인으로 돌아가기', onclick: goMain }, '←'),
      h('h1', null, mdwLabel(d)), h('span', { class: 'grow' }),
      d !== today ? h('button', { class: 'btn', type: 'button', onclick: () => { S.selEvent = null; location.replace('#day-' + today); } }, '오늘') : null,
      h('button', { class: 'icon-btn', type: 'button', 'aria-label': '전날', onclick: () => go(-1) }, '‹'),
      h('button', { class: 'icon-btn', type: 'button', 'aria-label': '다음 날', onclick: () => go(1) }, '›')),
    h('div', { class: 'daygrid' },
      h('section', { class: 'card', 'aria-label': '일정' },
        h('div', { class: 'head' }, h('h2', { class: 'grow' }, '일정')),
        strip.length ? h('div', { class: 'allday' }, strip.map(e => h('button', { class: 'chip' + (isTravel(e, P) ? ' trip' : '') + (S.selEvent === e.id ? ' sel' : ''), type: 'button',
          onclick: () => { S.selEvent = S.selEvent === e.id ? null : e.id; renderAll(); } }, evIcon(e) + ' ' + e.title))) : null,
        timeline, evcard, S.gcal.status !== 'ok' ? gcalStatusEl() : null),
      h('section', { class: 'card', 'aria-label': '할 일' },
        h('div', { class: 'head' }, h('h2', { class: 'grow' }, '할 일'), h('span', { class: 'muted small' }, tasks.filter(t => !t.done).length + '개 남음')),
        tasks.length ? h('ul', { class: 'rows' }, tasks.map(t => taskEl(t))) : h('p', { class: 'empty' }, '아직 할 일이 없어요.'),
        h('div', { class: 'addform' },
          h('div', { class: 'quick', style: 'margin-top:0' },
            h('input', { type: 'text', 'data-k': k('title'), value: dv(k('title'), ''), placeholder: '할 일 추가', 'aria-label': '할 일', autocomplete: 'off',
              onkeydown: e => { if(e.key === 'Enter' && !e.isComposing){ e.preventDefault(); add(); } } }),
            h('button', { class: 'btn-primary', type: 'button', onclick: add }, '추가')),
          h('div', { class: 'fields' },
            h('label', { class: 'field' }, '시간', h('input', { type: 'time', 'data-k': k('start'), value: dv(k('start'), ''), 'aria-label': '시작 시간' })),
            h('label', { class: 'field' }, '~', h('input', { type: 'time', 'data-k': k('end'), value: dv(k('end'), ''), 'aria-label': '끝나는 시간' })),
            h('label', { class: 'field' }, '마감', h('input', { type: 'date', 'data-k': k('due'), value: dv(k('due'), '') })))))),
    storageNote());
}

/* ================= trip view ================= */
function findTrip(){
  const r = S.tripRef; if(!r) return null;
  let t = CTX.trips.find(x => x.key === r.key);
  if(!t) t = CTX.trips.find(x => x.events.some(e => r.members.includes(e.id)));
  if(t){ r.key = t.key; r.members = t.events.map(e => e.id); }
  return t;
}
function renderTrip(){
  const t = findTrip();
  if(!t) return h('main', { class: 'app' },
    h('div', { class: 'dayhead' }, h('button', { class: 'icon-btn', type: 'button', 'aria-label': '메인으로 돌아가기', onclick: goMain }, '←'), h('h1', null, '여행')),
    h('div', { class: 'card' }, h('p', { class: 'empty' }, S.gcal.status === 'loading' ? '불러오는 중…' : '이 여행을 찾을 수 없어요. 메인으로 돌아가 주세요.')));
  const P = CTX.P;
  const saveName = () => {
    const v = (dv('trip-name', t.name) || '').trim(); delete S.drafts['trip-name'];
    if(t.manual) savePrefs(p => { p.manual = p.manual.map(m => m.id === t.manual.id ? Object.assign({}, m, { name: v || '여행' }) : m); });
    else savePrefs(p => { t.events.forEach(e => delete p.names[e.id]); if(v) p.names[t.events[0].id] = v; });
    toast('이름을 저장했어요.');
  };
  const memberIds = new Set(t.events.map(e => e.id));
  const lo = addDays(t.startDay, -2), hi = addDays(t.endDay, 2);
  const cands = CTX.evs.filter(e => !memberIds.has(e.id) && evFirst(e) <= hi && evLast(e) >= lo && !isTravel(e, P));
  const when = e => mdwLabel(evFirst(e)) + (e.allDay ? '' : ' ' + hm(e.start)) + (evLast(e) !== evFirst(e) ? ' – ' + mdLabel(evLast(e)) : '');
  return h('main', { class: 'app', style: 'max-width:760px' },
    h('div', { class: 'dayhead' },
      h('button', { class: 'icon-btn', type: 'button', 'aria-label': '메인으로 돌아가기', onclick: goMain }, '←'),
      h('h1', null, t.name), h('span', { class: 'grow' }), h('span', { class: 'muted' }, tripTag(t))),
    h('section', { class: 'card' },
      h('div', { class: 'namebar' },
        h('input', { type: 'text', 'data-k': 'trip-name', value: dv('trip-name', t.name), 'aria-label': '여행 이름',
          onkeydown: e => { if(e.key === 'Enter' && !e.isComposing){ e.preventDefault(); saveName(); } } }),
        h('button', { class: 'btn-primary', type: 'button', onclick: saveName }, '이름 저장')),
      h('p', { class: 'muted', style: 'margin:0' }, mdwLabel(t.startDay) + ' – ' + mdwLabel(t.endDay))),
    h('section', { class: 'card', style: 'margin-top:14px' },
      h('div', { class: 'head' }, h('h2', { class: 'grow' }, '포함된 일정')),
      t.events.length ? h('div', null, t.events.map(e => h('div', { class: 'trow' },
        h('span', { class: 'ic' }, evIcon(e)),
        h('span', { class: 'tx' }, h('div', null, e.title), h('div', { class: 'd' }, when(e))),
        h('button', { class: 'btn', type: 'button', onclick: () => setTravel(e, false) }, '빼기'))))
        : h('p', { class: 'empty' }, '아직 묶인 일정이 없어요. 아래에서 넣어 주세요.')),
    h('section', { class: 'card', style: 'margin-top:14px' },
      h('div', { class: 'head' }, h('h2', { class: 'grow' }, '이 기간의 다른 일정')),
      cands.length ? h('div', null, cands.map(e => h('div', { class: 'trow' },
        h('span', { class: 'ic' }, evIcon(e)),
        h('span', { class: 'tx' }, h('div', null, e.title), h('div', { class: 'd' }, when(e))),
        h('button', { class: 'btn', type: 'button', onclick: () => setTravel(e, true) }, '넣기'))))
        : h('p', { class: 'empty' }, '여행 앞뒤 이틀 안에 다른 일정이 없어요.')),
    h('div', { style: 'margin-top:14px' },
      t.manual
        ? h('button', { class: 'btn-text danger', type: 'button', onclick: () => { savePrefs(p => { p.manual = p.manual.filter(m => m.id !== t.manual.id); }); goMain(); toast('여행을 삭제했어요.'); } }, '이 여행 삭제')
        : h('button', { class: 'btn-text danger', type: 'button', onclick: () => { savePrefs(p => { p.hidden.push(t.events[0].id); }); goMain(); toast('여행을 숨겼어요. 메인에서 되돌릴 수 있어요.'); } }, '이 여행 숨기기')),
    storageNote());
}

/* ================= init ================= */
async function init(){
  if(location.hash === '#trip') history.replaceState(null, '', location.pathname + location.search);
  S.mode = 'auth';
  route();
  loadTok();
  auth.onAuthStateChanged(user => {
    if(user){
      if(S.mode === 'auth' || S.mode === 'signedout'){ S.mode = 'loading'; loadEvCache(); startDb(user.uid); startCalendar(); }
    } else {
      stopDb(); S.mode = 'signedout';
    }
    renderAll();
  });
}
let lastRefresh = Date.now();
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState !== 'visible' || !auth.currentUser) return;
  if(Date.now() - lastRefresh < 5 * 60000) { renderAll(); return; }
  lastRefresh = Date.now();
  if(!tokOk()){ S.gcal.status = 'error'; S.gcal.code = 'needs_token'; }
  if(anyTok()) refreshGcal(); else renderAll();
});
setInterval(() => { const a = document.activeElement; if(a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA')) return; renderAll(); }, 60000);
if('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(() => {});
init();
</script>
